# ============================================================
# Orchestrierung & Observability / Aufgabe 1:
# Registriert das prometheus-community Helm-Repository in ArgoCD,
# damit application-monitoring.yaml den kube-prometheus-stack-Chart
# als Chart-Quelle verwenden kann.
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: helm-prometheus-community
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: helm
  name: prometheus-community
  url: https://prometheus-community.github.io/helm-charts