# ============================================================
# Zentrale Konfiguration — KEIN Wert ist in den Templates fest.
# ============================================================

images:
  backend: ghcr.io/0x800f081f/user_mgmt_service-backend:latest
  frontend: ghcr.io/0x800f081f/user_mgmt_service-frontend:latest
  postgres: postgres:16-alpine

backend:
  replicas: 1
  port: 8080

frontend:
  replicas: 1
  port: 3000

db:
  replicas: 1
  port: 5432
  storage: 1Gi
  mountPath: /var/lib/postgresql

# Nicht-sensible Konfiguration -> ConfigMap
config:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  JWT_ISSUER: "Spring"
  JWT_EXPIRATION_MILLIS: "86400000"
  NEXT_PUBLIC_API_URL: "http://backend:8080"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "postgres"

# Sensible Werte -> Secret (Platzhalter! bei der Installation per --set ueberschreiben)
secret:
  SPRING_DATASOURCE_PASSWORD: "changeme"
  JWT_SECRET: "changeme-please-override-with-a-long-random-value"

# Ingress: hier auf AWS ALB voreingestellt (wie in vsc-ops).
# Fuer lokales Docker Desktop: className auf "nginx" setzen und annotations leeren.
ingress:
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/rewrite-pattern: /api/(.*)
    alb.ingress.kubernetes.io/conditions.backend: |
      [{"field":"path","pathConfig":{"values":["/api"]}}]
  paths:
    - path: /
      service: frontend
      port: 3000
    - path: /api
      service: backend
      port: 8080
