apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "user-mgmt.selectorLabels" "backend" | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "user-mgmt.selectorLabels" "backend" | nindent 8 }}
    spec:
      containers:
        - name: backend
          image: {{ .Values.images.backend.repository }}:{{ .Values.images.backend.tag }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "user-mgmt.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "user-mgmt.selectorLabels" "backend" | nindent 4 }}
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
