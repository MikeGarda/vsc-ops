# ============================================================
# PROD (Namespace user-mgmt-prod) - redundant, automatisch skalierend.
# ============================================================
backend:
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 640Mi }
  autoscaling:
    enabled: true
    minReplicas: 2      # nie weniger als 2 -> redundant
    maxReplicas: 4      # passt in die ResourceQuota
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1     # bei Wartung/Drain bleibt immer >= 1 Backend aktiv

frontend:
  replicas: 2           # 2 Frontends -> Ingress verteilt per Round Robin
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits:   { cpu: 400m, memory: 512Mi }

db:
  replicas: 1
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: 500m, memory: 640Mi }

resourceQuota:
  enabled: true
  requests: { cpu: "3", memory: 3Gi }
  limits:   { cpu: "5", memory: 5Gi }

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  dnsNamespace: kube-system
