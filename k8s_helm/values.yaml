# ============================================================
# Zentrale Konfiguration. KEIN Wert ist in den Templates fest.
# images.*.tag wird von der CI-Pipeline automatisch aktualisiert (Promotion).
# ============================================================

images:
  backend:
    repository: ghcr.io/mikegarda/user_mgmt_service-backend
    tag: 0ad0f28
  frontend:
    repository: ghcr.io/mikegarda/user_mgmt_service-frontend
    tag: 0ad0f28
  postgres: postgres:16-alpine
backend:
  replicas: 1
  port: 8080
frontend:
  replicas: 1
  port: 3000
db:
  replicas: 1
  port: 5432
  storage: 1Gi
  mountPath: /var/lib/postgresql
# Nicht-sensible Konfiguration -> ConfigMap
config:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  JWT_ISSUER: "Spring"
  JWT_EXPIRATION_MILLIS: "86400000"
  NEXT_PUBLIC_API_URL: "http://backend:8080"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "postgres"
# Ingress fuer DigitalOcean (nginx). Ein Pfad -> Frontend.
# Das Backend wird cluster-intern ueber http://backend:8080 angesprochen (BFF).
ingress:
  className: nginx
  annotations: {}
  paths:
    - path: /
      service: frontend
      port: 3000
# HINWEIS: Das Secret 'app-secret' (DB-Passwort + JWT-Secret) wird NICHT vom Chart
# verwaltet, sondern einmalig im Cluster angelegt (setup-gitops.ps1) - damit keine
# Geheimnisse im Git liegen. Die Deployments referenzieren es nur ueber den Namen.
