# ============================================================
# BASIS-Werte (Defaults). Werden je Umgebung von
# values-staging.yaml / values-prod.yaml ueberschrieben.
# images.*.tag wird von der CI-Pipeline aktualisiert (Promotion).
# ============================================================

images:
  backend:
    repository: ghcr.io/mikegarda/user_mgmt_service-backend
    tag: latest
  frontend:
    repository: ghcr.io/mikegarda/user_mgmt_service-frontend
    tag: latest
  postgres: postgres:16-alpine

backend:
  port: 8080
  autoscaling:
    minReplicas: 1
    maxReplicas: 6
    targetCPUUtilizationPercentage: 75
    targetMemoryUtilizationPercentage: 80

frontend:
  replicas: 1
  port: 3000

db:
  replicas: 1
  port: 5432
  storage: 1Gi
  mountPath: /var/lib/postgresql

config:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  JWT_ISSUER: "Spring"
  JWT_EXPIRATION_MILLIS: "86400000"
  NEXT_PUBLIC_API_URL: "http://backend:8080"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "postgres"

ingress:
  className: nginx
  annotations: {}
  paths:
    - path: /
      service: frontend
      port: 3000

# --- Aufgabe 5: Ressourcen-Deckel pro Namespace ---
resourceQuota:
  enabled: true
  requests: { cpu: "1", memory: 1Gi }
  limits:   { cpu: "2", memory: 2Gi }

# --- Aufgabe 5: Netzwerk-Isolation zwischen Namespaces ---
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx   # Namespace des nginx Ingress-Controllers
