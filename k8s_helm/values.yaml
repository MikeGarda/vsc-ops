# ============================================================
# BASIS-Werte (Defaults). Werden je Umgebung von
# values-staging.yaml / values-prod.yaml ueberschrieben.
# images.*.tag wird von der CI-Pipeline aktualisiert (Promotion).
# ============================================================

images:
  backend:
    repository: ghcr.io/mikegarda/user_mgmt_service-backend
    tag: c6b1636
  frontend:
    repository: ghcr.io/mikegarda/user_mgmt_service-frontend
    tag: c6b1636
  postgres: postgres:16-alpine
# Backend: KEIN 'replicas' - die Replica-Zahl wird vom HPA gesteuert (Aufgabe 6).
backend:
  port: 8080
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 400m, memory: 512Mi}
  autoscaling: # --- Aufgabe 6: HPA ---
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget: # --- Aufgabe 6: PDB ---
    enabled: true
    minAvailable: 1
frontend:
  replicas: 1
  port: 3000
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 300m, memory: 384Mi}
db:
  replicas: 1
  port: 5432
  storage: 1Gi
  mountPath: /var/lib/postgresql
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits: {cpu: 400m, memory: 512Mi}
config:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://db:5432/postgres"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  JWT_ISSUER: "Spring"
  JWT_EXPIRATION_MILLIS: "86400000"
  NEXT_PUBLIC_API_URL: "http://backend:8080"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "postgres"
ingress:
  className: nginx
  annotations: {}
  paths:
    - path: /
      service: frontend
      port: 3000
# --- Aufgabe 5: Ressourcen-Deckel pro Namespace ---
resourceQuota:
  enabled: true
  requests: {cpu: "1", memory: 1Gi}
  limits: {cpu: "2", memory: 2Gi}
# --- Aufgabe 5: Netzwerk-Isolation zwischen Namespaces ---
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  dnsNamespace: kube-system
