apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-mgmt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/0x800f081f/vsc-ops.git
    targetRevision: main
    path: k8s_helm
  destination:
    server: https://kubernetes.default.svc
    namespace: user-mgmt
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
