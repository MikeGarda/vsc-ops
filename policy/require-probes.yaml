# Aufgabe 5: gilt nur fuer die Namespaces der eigenen Anwendung. Fremd-Software
# (ArgoCD, ingress-nginx, Monitoring, metrics-server) liefert eigene Pod-Specs
# ohne Limits/Probes - cluster-weites Enforce wuerde deren Neustarts blockieren.
# Kyverno leitet aus der Pod-Regel automatisch Regeln fuer Deployments,
# StatefulSets, Jobs usw. ab (autogen) -> schon das Deployment wird abgelehnt.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-probes
spec:
  background: true
  rules:
    - name: check-probes
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [user-mgmt-staging, user-mgmt-prod]
      validate:
        failureAction: Enforce
        message: "livenessProbe und readinessProbe sind erforderlich."
        # KEINE Klammern (conditional anchor): "(livenessProbe)" hiesse "falls vorhanden"
        # und liesse Pods ganz ohne Probe durch. periodSeconds setzt der API-Server bei
        # jeder vorhandenen Probe automatisch -> fehlt die Probe, fehlt auch das Feld.
        pattern:
          spec:
            containers:
              - livenessProbe:
                  periodSeconds: ">0"
                readinessProbe:
                  periodSeconds: ">0"
