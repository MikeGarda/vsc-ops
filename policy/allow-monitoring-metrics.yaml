# Orchestrierung & Observability / Aufgabe 1 (Erweiterung Aufgabe 5, Kyverno):
# Eingehender Verkehr zu den Kyverno-Controllern im Namespace "policy".
#
# WICHTIG: Sobald eine NetworkPolicy einen Pod auswaehlt, ist fuer ihn nur noch
# erlaubt, was explizit freigegeben ist. Deshalb braucht es ZWEI Regeln:
#  1) Port 9443 = Admission-Webhooks. Der Kubernetes-API-Server fragt Kyverno
#     bei JEDER Pod-Erstellung an. Bei DigitalOcean laeuft der API-Server
#     ausserhalb des Clusters (verwaltete Control Plane) -> keine feste Quelle,
#     daher ohne "from". Fehlt diese Regel, laufen die Webhook-Aufrufe in einen
#     Timeout und Kyverno (failurePolicy Fail) blockiert JEDE Pod-Erstellung
#     im ganzen Cluster.
#  2) Port 8000 = Metriken, nur fuer Prometheus aus dem Namespace "monitoring".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-metrics
  namespace: policy
  labels:
    app.kubernetes.io/part-of: kyverno
    app.kubernetes.io/managed-by: vsc-ops
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: kyverno
  policyTypes:
    - Ingress
  ingress:
    # 1) Admission-Webhooks (API-Server -> Kyverno)
    - ports:
        - protocol: TCP
          port: 9443
    # 2) Prometheus-Scrape der Kyverno-Metriken
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
